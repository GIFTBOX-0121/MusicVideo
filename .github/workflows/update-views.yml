name: Update YouTube Views

on:
  # 1時間ごとに現在値を更新
  schedule:
    - cron: "17 * * * *"

    # 日本時間 23:59 ごろに日次記録
    - cron: "59 14 * * *"

  # 手動実行用
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get YouTube view counts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          # =========================
          # MV一覧
          # =========================
          videos = [
              {"title": "WISHES", "id": "3gsVVVndUKM"},
              {"title": "StarWish", "id": "-Fhuw0VzelM"},
              {"title": "USOTSUKI", "id": "Nk3b5KnL4hg"},
              {"title": "Drivin' My Life", "id": "zbSQaKFjyXI"},
              {"title": "Green Light", "id": "FKtMzDOV08M"},
              {"title": "Good Boys Anthem", "id": "jK_uGTE66oo"},
          ]

          api_key = os.environ["YOUTUBE_API_KEY"]

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)

          # =========================
          # YouTube API
          # =========================
          ids = ",".join(video["id"] for video in videos)

          params = urllib.parse.urlencode({
              "part": "statistics",
              "id": ids,
              "key": api_key
          })

          url = "https://www.googleapis.com/youtube/v3/videos?" + params

          with urllib.request.urlopen(url) as response:
              result = json.load(response)

          counts = {
              item["id"]: int(item["statistics"]["viewCount"])
              for item in result["items"]
          }

          Path("data").mkdir(exist_ok=True)

          # =========================
          # 現在値
          # =========================
          current = {
              "updated_at": now.isoformat(timespec="minutes"),
              "videos": [
                  {
                      "title": video["title"],
                      "id": video["id"],
                      "views": counts.get(video["id"], 0)
                  }
                  for video in videos
              ]
          }

          with open(
              "data/current.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  current,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("=== YouTube View Counts ===")

          for video in current["videos"]:
              print(
                  video["title"],
                  "→",
                  f'{video["views"]:,}',
                  "views"
              )

          # =========================
          # 日次記録
          # =========================
          #
          # 23:50〜23:59に実行された時だけ
          # その日の最終値として history.json に保存
          #
          # 9/23 → 初日の基準値
          # 9/24 → 9/23との差を計算可能
          #

          if now.hour == 23 and now.minute >= 50:

              history_file = Path("data/history.json")

              if history_file.exists():
                  with history_file.open(
                      "r",
                      encoding="utf-8"
                  ) as f:
                      history = json.load(f)
              else:
                  history = []

              today = now.strftime("%Y-%m-%d")

              daily_record = {
                  "date": today,
                  "videos": [
                      {
                          "title": video["title"],
                          "id": video["id"],
                          "views": counts.get(video["id"], 0)
                      }
                      for video in videos
                  ]
              }

              # 同じ日のデータがすでにあれば置き換える
              history = [
                  record
                  for record in history
                  if record.get("date") != today
              ]

              history.append(daily_record)

              # 日付順
              history.sort(
                  key=lambda record: record["date"]
              )

              with history_file.open(
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      history,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print("Daily record saved:", today)

          else:
              print("Current views updated.")
              print("Daily record not required.")

          PY

      - name: Save YouTube view data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update YouTube view data"
            git pull --rebase
            git push
          fi