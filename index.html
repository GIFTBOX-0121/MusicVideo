<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STARS BASE</title>

  <!-- リンクプレビュー -->
  <meta name="description" content=" ">
  <meta property="og:title" content="STARS BASE">
  <meta property="og:description" content=" ">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="STARS BASE">
  <meta name="twitter:description" content=" ">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          180deg,
          #eef0f5 0%,
          #f6f7f9 35%,
          #eceef4 100%
        );
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    /* ========================================
       星が降る背景
       ======================================== */

    #star-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .falling-star {
      position: absolute;
      top: -40px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow:
        0 0 5px rgba(255, 255, 255, 0.95),
        0 0 12px rgba(190, 200, 220, 0.8);
      user-select: none;
      animation:
        starFall linear forwards,
        starTwinkle 1.8s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    @keyframes starFall {
      0% {
        transform:
          translate3d(0, -40px, 0)
          rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      90% {
        opacity: 0.9;
      }

      100% {
        transform:
          translate3d(35px, 110vh, 0)
          rotate(180deg);
        opacity: 0;
      }
    }

    @keyframes starTwinkle {
      from {
        filter: brightness(0.8);
      }

      to {
        filter: brightness(1.5);
      }
    }

    /* サイト本体を星より前に表示 */

    .container {
      position: relative;
      z-index: 1;
      width: min(94%, 760px);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .updated {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
    }

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 18px;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .video-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .thumbnail {
      width: 135px;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
    }

    .video-info {
      min-width: 0;
      flex: 1;
    }

    .title {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .trending {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 9px;
      border: 2px solid #e53935;
      border-radius: 8px;
      color: #d32f2f;
      background: #fff5f5;
      font-size: 12px;
      font-weight: 800;
    }

    .youtube-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 13px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .youtube-button:active {
      transform: scale(0.98);
      opacity: 0.8;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      text-align: center;
      min-width: 0;
    }

    .stat + .stat {
      border-left: 1px solid #e8e8e8;
    }

    .stat-label {
      margin-bottom: 6px;
      font-size: 12px;
      color: #777;
    }

    .stat-number {
      font-size: clamp(20px, 6vw, 30px);
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
    }

    .changes {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.8;
    }

    .change-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .change-label {
      color: #888;
    }

    .change-number {
      font-weight: 700;
    }

    .goal {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .goal-text {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .goal-near {
      margin-left: 4px;
    }

    .progress {
      width: 100%;
      height: 12px;
      margin-top: 11px;
      overflow: hidden;
      background: #ececec;
      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      background: #111;
      border-radius: 999px;
      transition: width .5s ease;
    }

    .progress-percent {
      margin-top: 6px;
      text-align: right;
      font-size: 12px;
      color: #777;
    }

    .chart-card {
      margin-top: 26px;
      padding: 22px 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .chart-title {
      margin: 0 0 20px;
      text-align: center;
      font-size: 18px;
    }

    .chart-wrap {
      position: relative;
      height: 390px;
    }

    .loading {
      padding: 60px 0;
      text-align: center;
      color: #777;
    }

    .error {
      padding: 30px 15px;
      text-align: center;
      color: #b00020;
      background: #fff;
      border-radius: 18px;
    }

    @media (max-width: 420px) {
      .container {
        width: 95%;
      }

      .card {
        padding: 14px;
      }

      .thumbnail {
        width: 120px;
      }

      .title {
        font-size: 18px;
      }

      .youtube-button {
        font-size: 11px;
        padding: 7px 10px;
      }

      .stat-number {
        font-size: 21px;
      }

      .changes {
        font-size: 11px;
      }

      .chart-wrap {
        height: 350px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .falling-star {
        animation: none;
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- 星専用レイヤー -->
  <div id="star-background"></div>

  <div class="container">

    <header>

      <h1>STARS BASE</h1>

      <div
        id="updated"
        class="updated"
      ></div>

    </header>

    <main>

      <div
        id="cards"
        class="cards"
      >
        <div class="loading">
          データを取得しています...
        </div>
      </div>

      <section class="chart-card">

        <h2 class="chart-title">
          📈 MV 再生回数 日別推移
        </h2>

        <div class="chart-wrap">
          <canvas id="historyChart"></canvas>
        </div>

      </section>

    </main>

  </div>


  <script>

    const API_URL =
      "https://musicvideo-views.starsx0601.workers.dev";


    const VIDEO_ORDER = [
      "WISHES",
      "StarWish",
      "USOTSUKI",
      "Drivin' My Life",
      "Green Light",
      "Good Boys Anthem"
    ];


    let historyChart = null;


    // ========================================
    // 🌟 星を降らせる
    // ========================================

    const starBackground =
      document.getElementById(
        "star-background"
      );


    const STAR_SYMBOLS = [
      "✦",
      "✧",
      "⋆",
      "★",
      "☆"
    ];


    function createStar() {

      const star =
        document.createElement("span");


      star.className =
        "falling-star";


      star.textContent =
        STAR_SYMBOLS[
          Math.floor(
            Math.random() *
            STAR_SYMBOLS.length
          )
        ];


      const size =
        8 +
        Math.random() * 13;


      const duration =
        9 +
        Math.random() * 10;


      star.style.left =
        Math.random() * 100 +
        "vw";


      star.style.fontSize =
        size +
        "px";


      star.style.animationDuration =
        duration + "s, " +
        (
          1.2 +
          Math.random() * 2
        ) +
        "s";


      star.style.opacity =
        0.45 +
        Math.random() * 0.5;


      starBackground.appendChild(
        star
      );


      setTimeout(
        () => {
          star.remove();
        },
        duration * 1000
      );

    }


    // 最初から少し星を出す
    for (let i = 0; i < 12; i++) {

      setTimeout(
        createStar,
        i * 250
      );

    }


    // その後も降り続ける
    setInterval(
      createStar,
      650
    );


    // ========================================
    // 数字
    // ========================================

    function formatNumber(number) {
      return Number(number || 0)
        .toLocaleString("ja-JP");
    }


    function formatChange(value, unit = "") {

      if (
        value === null ||
        value === undefined
      ) {
        return "―";
      }

      const sign =
        value >= 0
          ? "+"
          : "";

      return (
        sign +
        formatNumber(value) +
        unit
      );
    }


    // ========================================
    // 次の目標
    // ========================================

    function getGoal(views) {

      const goals = [
        100000,
        200000,
        300000,
        400000,
        500000,
        1000000
      ];


      for (const goal of goals) {

        if (views < goal) {
          return goal;
        }

      }


      return (
        Math.floor(
          views / 1000000
        ) + 1
      ) * 1000000;
    }


    function goalLabel(goal) {

      return (
        goal / 10000
      ).toLocaleString("ja-JP") +
      "万";
    }


    function getPreviousGoal(goal) {

      if (goal === 100000) {
        return 0;
      }

      if (goal <= 500000) {
        return goal - 100000;
      }

      if (goal === 1000000) {
        return 500000;
      }

      return goal - 1000000;
    }


    function createGoal(video) {

      const goal =
        getGoal(video.views);

      const previousGoal =
        getPreviousGoal(goal);

      const remaining =
        Math.max(
          goal - video.views,
          0
        );


      const range =
        goal - previousGoal;


      const progress =
        video.views - previousGoal;


      const percent =
        Math.max(
          0,
          Math.min(
            progress / range * 100,
            100
          )
        );


      const nearGoal =
        percent >= 90
          ? `<span class="goal-near">❤️‍🔥</span>`
          : "";


      return `
        <div class="goal">

          <div class="goal-text">
            ${goalLabel(goal)}回再生まで
            あと${formatNumber(remaining)}回
            ${nearGoal}
          </div>

          <div class="progress">

            <div
              class="progress-bar"
              style="width:${percent}%"
            ></div>

          </div>

          <div class="progress-percent">
            ${percent.toFixed(1)}%
          </div>

        </div>
      `;
    }


    // ========================================
    // YouTube
    // ========================================

    function getThumbnail(videoId) {

      return (
        "https://i.ytimg.com/vi/" +
        videoId +
        "/hqdefault.jpg"
      );

    }


    function getYouTubeUrl(videoId) {

      return (
        "https://www.youtube.com/watch?v=" +
        videoId
      );

    }


    // ========================================
    // 急上昇
    // ========================================

    function createTrending(video) {

      if (!video.trending_rank) {
        return "";
      }


      return `
        <div class="trending">
          📢 急上昇の音楽 #${video.trending_rank}
        </div>
      `;

    }


    // ========================================
    // MVカード
    // ========================================

    function createCard(video) {

      const hourlyViews =
        video.hourly_change?.views;

      const hourlyLikes =
        video.hourly_change?.likes;

      const dailyViews =
        video.daily_change?.views;

      const dailyLikes =
        video.daily_change?.likes;


      return `
        <article class="card">

          <div class="video-header">

            <img
              class="thumbnail"
              src="${getThumbnail(video.id)}"
              alt="${video.title}"
              loading="lazy"
            >


            <div class="video-info">

              <h2 class="title">
                ${video.title}
              </h2>


              ${createTrending(video)}


              <div>

                <a
                  class="youtube-button"
                  href="${getYouTubeUrl(video.id)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ▶ YouTubeでMVを見る
                </a>

              </div>

            </div>

          </div>


          <div class="stats">


            <div class="stat">

              <div class="stat-label">
                ▶ 再生回数
              </div>

              <div class="stat-number">
                ${formatNumber(
                  video.views
                )}
              </div>


              <div class="changes">

                <div class="change-row">

                  <span class="change-label">
                    1時間比
                  </span>

                  <span class="change-number">
                    ${formatChange(
                      hourlyViews,
                      "回"
                    )}
                  </span>

                </div>


                <div class="change-row">

                  <span class="change-label">
                    前日比
                  </span>

                  <span class="change-number">
                    ${formatChange(
                      dailyViews,
                      "回"
                    )}
                  </span>

                </div>

              </div>

            </div>


            <div class="stat">

              <div class="stat-label">
                👍 高評価
              </div>

              <div class="stat-number">
                ${formatNumber(
                  video.likes
                )}
              </div>


              <div class="changes">

                <div class="change-row">

                  <span class="change-label">
                    1時間比
                  </span>

                  <span class="change-number">
                    ${formatChange(
                      hourlyLikes
                    )}
                  </span>

                </div>


                <div class="change-row">

                  <span class="change-label">
                    前日比
                  </span>

                  <span class="change-number">
                    ${formatChange(
                      dailyLikes
                    )}
                  </span>

                </div>

              </div>

            </div>

          </div>


          ${createGoal(video)}

        </article>
      `;
    }


    // ========================================
    // 更新日時
    // ========================================

    function showUpdatedTime(iso) {

      const date =
        new Date(iso);


      const formatter =
        new Intl.DateTimeFormat(
          "ja-JP",
          {
            timeZone:
              "Asia/Tokyo",

            month:
              "numeric",

            day:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );


      document.getElementById(
        "updated"
      ).textContent =
        formatter.format(date) +
        " 時点";
    }


    // ========================================
    // 日別グラフ
    // ========================================

    function drawHistory(history) {

      const dates = [
        ...new Set(
          history.map(
            item =>
              item.jst_date
          )
        )
      ];


      const datasets =
        VIDEO_ORDER.map(title => {

          const rows =
            history.filter(
              item =>
                item.title === title
            );


          const values =
            dates.map(date => {

              const row =
                rows.find(
                  item =>
                    item.jst_date === date
                );


              return row
                ? Number(row.views)
                : null;
            });


          return {
            label: title,
            data: values,
            tension: 0.25,
            spanGaps: true,
            borderWidth: 2,
            pointRadius: 3
          };
        });


      if (historyChart) {
        historyChart.destroy();
      }


      const ctx =
        document.getElementById(
          "historyChart"
        );


      historyChart =
        new Chart(
          ctx,
          {

            type: "line",

            data: {
              labels: dates,
              datasets: datasets
            },


            options: {

              responsive: true,

              maintainAspectRatio: false,


              interaction: {
                mode: "index",
                intersect: false
              },


              plugins: {

                legend: {
                  position: "bottom",

                  labels: {
                    boxWidth: 12,
                    padding: 14
                  }
                },


                tooltip: {

                  callbacks: {

                    label(context) {

                      const value =
                        context.parsed.y;


                      if (value === null) {
                        return "";
                      }


                      return (
                        context.dataset.label +
                        "：" +
                        formatNumber(value) +
                        "回"
                      );
                    }

                  }

                }

              },


              scales: {

                y: {

                  ticks: {

                    callback(value) {

                      return Number(value)
                        .toLocaleString(
                          "ja-JP",
                          {
                            notation:
                              "compact"
                          }
                        );
                    }

                  }

                },


                x: {

                  ticks: {
                    maxRotation: 0
                  }

                }

              }

            }

          }
        );
    }


    // ========================================
    // データ取得
    // ========================================

    async function loadData() {

      const cards =
        document.getElementById(
          "cards"
        );


      try {

        const response =
          await fetch(
            API_URL +
            "?t=" +
            Date.now(),
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "API error"
          );

        }


        const data =
          await response.json();


        showUpdatedTime(
          data.updated_at
        );


        const sortedVideos =
          [...data.videos]
            .sort(
              (a, b) =>
                VIDEO_ORDER.indexOf(
                  a.title
                ) -
                VIDEO_ORDER.indexOf(
                  b.title
                )
            );


        cards.innerHTML =
          sortedVideos
            .map(
              createCard
            )
            .join("");


        drawHistory(
          data.daily_history || []
        );


      } catch (error) {

        console.error(
          error
        );


        cards.innerHTML = `
          <div class="error">
            データを取得できませんでした。<br>
            少し時間を置いて再読み込みしてください。
          </div>
        `;

      }

    }


    loadData();

  </script>

</body>
</html>
