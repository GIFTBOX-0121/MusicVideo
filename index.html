<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STARS BASE</title>

  <meta name="description" content=" ">
  <meta property="og:title" content="STARS BASE">
  <meta property="og:description" content=" ">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="STARS BASE">
  <meta name="twitter:description" content=" ">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(72, 98, 160, 0.30) 0%,
          rgba(72, 98, 160, 0) 42%
        ),
        linear-gradient(
          180deg,
          #0d1b3d 0%,
          #142b55 42%,
          #202550 100%
        );

      background-attachment: fixed;

      color: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    /* ========================================
       星が降る背景
       ======================================== */

    #star-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .falling-star {
      position: absolute;
      top: -40px;

      color: rgba(255, 221, 87, 0.98);

      text-shadow:
        0 0 5px rgba(255, 226, 105, 0.95),
        0 0 12px rgba(255, 202, 40, 0.72);

      user-select: none;

      animation:
        starFall linear forwards,
        starTwinkle 1.8s ease-in-out infinite alternate;

      will-change: transform, opacity;
    }

    @keyframes starFall {
      0% {
        transform: translate3d(0, -40px, 0) rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      90% {
        opacity: 0.9;
      }

      100% {
        transform: translate3d(35px, 110vh, 0) rotate(180deg);
        opacity: 0;
      }
    }

    @keyframes starTwinkle {
      from {
        filter: brightness(0.8);
      }

      to {
        filter: brightness(1.5);
      }
    }

    /* ========================================
       サイト本体
       ======================================== */

    .container {
      position: relative;
      z-index: 1;

      width: min(94%, 760px);
      margin: 0 auto;

      padding: 30px 0 40px;
    }

    /* ========================================
       ヘッダー
       ======================================== */

    header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: 14px;

      margin-bottom: 22px;

      color: #fff;
    }

    .header-left {
      padding-top: 5px;
      text-align: left;
    }

    header h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;

      color: #fff;

      white-space: nowrap;

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.22);
    }

    .updated {
      margin-top: 8px;

      color: rgba(255, 255, 255, 0.74);

      font-size: 12px;
    }

    /* ========================================
       リアルタイム再生履歴
       ======================================== */

    .realtime {
      min-width: 0;
      text-align: left;
      color: rgba(255, 255, 255, 0.88);
    }

    .realtime-title {
      margin-bottom: 4px;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
    }

    .realtime-list {
      display: grid;
      gap: 1px;
    }

    .realtime-item {
      overflow: hidden;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: rgba(255, 255, 255, 0.74);
    }

    .realtime-empty {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.48);
      text-align: center;
    }

    /* ========================================
       キリ番間近
       ======================================== */

    .milestone-alerts {
      display: grid;
      gap: 7px;
      margin-bottom: 18px;
    }

    .milestone-alert {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 7px 7px 7px 10px;
      border: 2px solid #e53935;
      border-radius: 10px;
      background: rgba(255, 245, 245, 0.97);
      color: #d32f2f;
    }

    .milestone-message {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .milestone-play {
      flex-shrink: 0;
      margin-left: 7px;
      padding: 6px 8px;
      border-radius: 7px;
      background: #e53935;
      color: #fff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .prediction-note {
      margin: 24px 0 14px;
      text-align: center;
      color: rgba(255, 255, 255, 0.72);
      font-size: 10px;
      line-height: 1.5;
    }

    /* ========================================
       RANDOM VIDEO
       ======================================== */

    .random-video {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      margin: 0 0 16px;
      padding: 9px 12px;

      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      color: #fff;
    }

    .random-label {
      flex-shrink: 0;

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.7px;

      white-space: nowrap;
    }

    .random-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .random-star {
      appearance: none;
      -webkit-appearance: none;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 27px;
      height: 27px;
      padding: 0;

      border: 0;
      background: transparent;

      color: #ffe45c;

      font-size: 24px;
      line-height: 1;

      cursor: pointer;

      text-shadow:
        0 0 5px rgba(255, 226, 105, 0.75),
        0 0 10px rgba(255, 202, 40, 0.45);

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .random-star:active {
      transform: scale(0.78);
      filter: brightness(1.5);
    }

    /* ========================================
       FEATURED VIDEO
       ======================================== */

    .featured-videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 18px;
    }

    .featured-video {
      min-width: 0;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .featured-video a {
      display: block;
      color: #111;
      text-decoration: none;
    }

    .featured-thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #eee;
    }

    .featured-text {
      padding: 7px 8px 8px;
      min-width: 0;
    }

    .featured-group,
    .featured-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .featured-group {
      font-size: 9px;
      font-weight: 700;
      color: #777;
      line-height: 1.35;
    }

    .featured-title {
      margin-top: 2px;
      font-size: 11px;
      font-weight: 900;
      color: #111;
      line-height: 1.35;
    }

    /* ========================================
       MVカード
       ======================================== */

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .video-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .thumbnail {
      width: 135px;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
    }

    .video-info {
      min-width: 0;
      flex: 1;
    }

    .title {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .trending {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 9px;
      border: 2px solid #e53935;
      border-radius: 8px;
      color: #d32f2f;
      background: #fff5f5;
      font-size: 12px;
      font-weight: 800;
    }

    .youtube-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 13px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    /* ========================================
       再生回数・高評価
       ======================================== */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      text-align: center;
      min-width: 0;
    }

    .stat + .stat {
      border-left: 1px solid #e8e8e8;
    }

    .stat-label {
      margin-bottom: 6px;
      font-size: 12px;
      color: #777;
    }

    .stat-number {
      font-size: clamp(20px, 6vw, 30px);
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
    }

    .changes {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.8;
    }

    .change-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .change-label {
      color: #888;
    }

    .change-number {
      font-weight: 700;
    }

    .change-box {
      width: 92%;
      margin: 5px auto 9px;
      padding: 5px 6px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      background: #f8f8f8;
      color: #555;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }

    /* ========================================
       目標
       ======================================== */

    .goal {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .goal-text {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .goal-near {
      margin-left: 4px;
    }

    /* ========================================
       達成予測
       ======================================== */

    .pace-box {
      position: relative;
      overflow: hidden;

      margin: 10px auto 4px;
      padding: 7px 10px;

      border: 2px solid;
      border-radius: 9px;

      text-align: center;
    }

    .pace-up {
      border-color: #e53935;
      background: #fff5f5;
      color: #c62828;
    }

    .pace-steady {
      border-color: #43a047;
      background: #f3fff4;
      color: #2e7d32;
    }

    .pace-down {
      border-color: #1e88e5;
      background: #f3f8ff;
      color: #1565c0;
    }

    .pace-calculating {
      border-color: #999;
      background: #f8f8f8;
      color: #666;
    }

    .pace-arrow-bg {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;

      width: max-content;

      opacity: 0.09;

      font-size: 25px;
      font-weight: 900;
      letter-spacing: 7px;

      white-space: nowrap;

      animation: paceMove 4s linear infinite;
    }

    @keyframes paceMove {
      from {
        transform: translateX(-10%);
      }

      to {
        transform: translateX(10%);
      }
    }

    .pace-content {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: 4px 9px;
    }

    .pace-status {
      font-size: 11px;
      font-weight: 900;
    }

    .pace-prediction {
      font-size: 9.5px;
      font-weight: 700;
    }

    .progress {
      width: 100%;
      height: 12px;
      margin-top: 11px;
      overflow: hidden;
      background: #ececec;
      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      background: #111;
      border-radius: 999px;
      transition: width .5s ease;
    }

    .progress-percent {
      margin-top: 6px;
      text-align: right;
      font-size: 12px;
      color: #777;
    }

    /* ========================================
       グラフ
       ======================================== */

    .chart-card {
      margin-top: 26px;
      padding: 22px 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .chart-title {
      margin: 0 0 20px;
      text-align: center;
      font-size: 18px;
    }

    .chart-wrap {
      position: relative;
      height: 390px;
    }

    .footer {
      margin-top: 34px;
      padding-bottom: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.55);
    }

    .loading {
      padding: 60px 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.75);
    }

    .error {
      padding: 30px 15px;
      text-align: center;
      color: #b00020;
      background: #fff;
      border-radius: 18px;
    }

    @media (max-width: 420px) {

      .container {
        width: 95%;
      }

      header {
        grid-template-columns: 46% 54%;
        gap: 5px;
      }

      header h1 {
        font-size: 22px;
        letter-spacing: 0.7px;
      }

      .updated {
        font-size: 10px;
      }

      .realtime-title {
        font-size: 9px;
      }

      .realtime-item {
        font-size: 8.5px;
      }

      .milestone-message {
        font-size: 10.5px;
      }

      .milestone-play {
        margin-left: 5px;
        padding: 6px 7px;
        font-size: 9px;
      }

      .prediction-note {
        margin-top: 22px;
        font-size: 9px;
      }

      .random-video {
        gap: 6px;
        padding: 8px 7px;
      }

      .random-label {
        font-size: 9.5px;
        letter-spacing: 0.3px;
      }

      .random-stars {
        gap: 3px;
      }

      .random-star {
        width: 25px;
        height: 25px;
        font-size: 22px;
      }

      .card {
        padding: 14px;
      }

      .thumbnail {
        width: 120px;
      }

      .title {
        font-size: 18px;
      }

      .youtube-button {
        font-size: 11px;
        padding: 7px 10px;
      }

      .stat-number {
        font-size: 21px;
      }

      .changes {
        font-size: 11px;
      }

      .change-box {
        width: 96%;
        font-size: 9.5px;
        padding: 5px 4px;
      }

      .pace-status {
        font-size: 10px;
      }

      .pace-prediction {
        font-size: 9px;
      }

      .chart-wrap {
        height: 350px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .falling-star,
      .pace-arrow-bg {
        animation: none;
      }
    }


    /* BMSG artist collection — isolated from statistics */
    .bmsg-fab{position:fixed;left:calc(100vw - 82px);top:42%;width:64px;height:64px;border-radius:50%;border:none;background:#050505;color:#fff;box-shadow:0 4px 18px #0009;z-index:1100;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:-.5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
    /* BMSG floating button — larger aurora sparkle ring */
    .bmsg-fab{width:80px;height:80px;left:calc(100vw - 98px);font-size:14px;background:linear-gradient(#080a13,#080a13) padding-box,conic-gradient(from 0deg,#ffffff,#aab8ed,#f8faff,#c99df3,#ffffff,#93b9ed,#ffffff) border-box;border:3px solid transparent;box-shadow:0 0 0 2px #ffffff35,0 0 18px #b5a4ef88,0 4px 20px #000b;animation:bmsgAura 7s ease-in-out infinite;}
    .bmsg-fab::after{content:'✦';position:absolute;top:-11px;right:6px;color:white;font-size:19px;text-shadow:0 0 9px #fff,0 0 15px #b7a2ff;pointer-events:none;}
    .bmsg-fab:active{cursor:grabbing}.bmsg-fab span{border:none;padding:3px 4px;pointer-events:none;text-shadow:0 0 9px #ffffff66}
    @keyframes bmsgAura{0%,100%{box-shadow:0 0 0 2px #ffffff35,0 0 12px #b5a4ef88,0 4px 20px #000b}50%{box-shadow:0 0 0 2px #ffffff77,0 0 25px #c8b7ffbb,0 4px 20px #000b}}
    @media(max-width:420px){.bmsg-fab{width:74px;height:74px;font-size:14px}}
    @media(prefers-reduced-motion:reduce){.bmsg-fab{animation:none}}
    .bmsg-overlay[hidden],.bmsg-artist-page[hidden]{display:none!important}
    .bmsg-overlay{position:fixed;inset:0;z-index:1200;background:rgba(3,8,24,.77);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .bmsg-dialog{width:min(100%,430px);max-height:85dvh;overflow:auto;background:linear-gradient(150deg,#15284d,#0b1027);color:white;border:1px solid #ffffff45;border-radius:22px;padding:20px;box-shadow:0 18px 50px #0009}
    .bmsg-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.bmsg-dialog-head h2{margin:0;font-size:18px;letter-spacing:2px}
    .bmsg-close,.bmsg-back{border:1px solid #ffffff55;border-radius:999px;background:#ffffff16;color:#fff;cursor:pointer;padding:9px 14px;font-weight:700}
    .bmsg-artist-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .bmsg-menu-featured{grid-column:1/-1;width:100%;min-height:55px;font-size:15px;letter-spacing:.07em;background:linear-gradient(110deg,#344d86,#172c5c);border:1px solid #b9c9f788}
    .bmsg-menu-columns{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
    .bmsg-menu-column{display:flex;flex-direction:column;gap:9px;min-width:0}
    .bmsg-menu-heading{font-size:11px;letter-spacing:.12em;color:#dce5ff;font-weight:900;min-height:19px;margin:0 0 3px 2px}
    .bmsg-menu-column .bmsg-artist-choice{width:100%;overflow-wrap:anywhere}
    .bmsg-artist-choice{min-height:45px;border:1px solid #ffffff40;border-radius:11px;background:#ffffff12;color:white;font-size:12px;font-weight:800;cursor:pointer;padding:9px 5px}
    .bmsg-artist-choice:active{background:#ffffff38}
    .bmsg-artist-page{position:relative;z-index:2;min-height:65vh;color:#fff;padding:12px 0 32px}
    .bmsg-page-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.bmsg-page-head h2{font-size:clamp(19px,5vw,28px);margin:0;overflow-wrap:anywhere}
    .bmsg-page-note{color:#ffffffc7;font-size:13px;line-height:1.8;padding:22px;border:1px solid #ffffff30;border-radius:14px;background:#ffffff0b}
    .bmsg-page-status{color:#d5dcf0;font-size:12px;margin:0 0 12px}
    .bmsg-filter-list{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
    .bmsg-filter{border:1px solid #ffffff55;border-radius:999px;background:#ffffff13;color:white;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer}
    .bmsg-filter[aria-pressed="true"]{background:#fff;color:#14213c;border-color:#fff}
    .bmsg-video-grid{display:flex;flex-direction:column;gap:22px}
    .bmsg-song-group{min-width:0;border:1px solid #b9c9f744;border-radius:12px;overflow:hidden;background:#ffffff08}
    .bmsg-song-group[open] .bmsg-song-heading{border-bottom:1px solid #b9c9f755}
    .bmsg-song-group summary{list-style:none;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
    .bmsg-song-group summary::-webkit-details-marker{display:none}
    .bmsg-song-group summary:after{content:'＋';float:right;font-size:18px;line-height:1.2}
    .bmsg-song-group[open] summary:after{content:'－'}
    .bmsg-song-heading{margin:0;padding:12px 14px;text-align:center;font-size:15px;font-weight:900;line-height:1.5;overflow-wrap:anywhere;background:linear-gradient(110deg,#344d86,#172c5c);border:1px solid #b9c9f788;border-radius:12px;color:white}
    .bmsg-song-videos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px}

    .bmsg-filter-label{color:#dce5ff;font-size:12px;font-weight:800;margin:10px 0 7px}
    .bmsg-filter-list{margin-bottom:12px}
    .bmsg-filter-reset{margin:0 0 15px}
    .bmsg-video-card{overflow:hidden;border:1px solid #ffffff2a;border-radius:13px;background:#ffffffed;color:#121625;min-width:0}
    .bmsg-video-link{display:block;color:inherit;text-decoration:none}
    .bmsg-video-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#dfe3ed}
    .bmsg-video-body{padding:7px 6px 9px}
    .bmsg-video-title{margin:0;font-size:clamp(9px,1.6vw,12px);line-height:1.4;font-weight:800;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .bmsg-video-type{font-size:10px;color:#5e6471;margin-top:5px}

<script>


/* BMSG artist navigation — independent of existing statistics */
(function initBmsgNavigation(){
  const ADMIN_PUBLIC_API='https://starsbase-artist-admin.starsx0601.workers.dev';
  const solo=['SKY-HI','Novel Core','Aile The Shota','edhiii boi','REIKO','SALU','ふみの','Ayumu Imazu'];
  const group=['STARGLOW','BMSG','BE:FIRST','MAZZEL','HANA','ShowMinorSavage','BMSG TRAINEE'];
  const fab=document.getElementById('bmsgFab');
  const overlay=document.getElementById('bmsgOverlay');
  const close=document.getElementById('bmsgClose');
  const list=document.getElementById('bmsgArtistList');
  const page=document.getElementById('bmsgArtistPage');
  const pageTitle=document.getElementById('bmsgPageTitle');
  const back=document.getElementById('bmsgBack');
  const main=document.getElementById('starsMain');
  const header=document.getElementById('starsHeader');
  const footer=document.getElementById('starsFooter');
  const grid=document.getElementById('bmsgVideoGrid');
  const folderNav=document.getElementById('bmsgFolderNav');
  const folderModal=document.getElementById('bmsgFolderModal');
  const folderModalTitle=document.getElementById('bmsgFolderModalTitle');
  const folderModalVideos=document.getElementById('bmsgFolderModalVideos');
  const folderModalClose=document.getElementById('bmsgFolderModalClose');
  let lastFolderTrigger=null;
  function closeFolderModal(){if(folderModal.hidden)return;folderModal.hidden=true;document.body.style.overflow='';if(lastFolderTrigger?.isConnected)lastFolderTrigger.focus();}
  folderModalClose.addEventListener('click',closeFolderModal);
  folderModal.addEventListener('click',e=>{if(e.target===folderModal)closeFolderModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!folderModal.hidden){e.stopPropagation();closeFolderModal();}});
  function openFolderModal(folder,items,trigger){
    lastFolderTrigger=trigger;folderModalTitle.textContent=folder.name;folderModalVideos.replaceChildren();
    for(const v of items){const card=createVideoCard(v);if(card)folderModalVideos.append(card);}
    folderModal.hidden=false;document.body.style.overflow='hidden';folderModalClose.focus();
  }

  const empty=document.getElementById('bmsgPageEmpty');
  const status=document.getElementById('bmsgPageStatus');
  const filters=document.getElementById('bmsgTagFilters');
  const typeFilters=document.getElementById('bmsgTypeFilters');
  const tagLabel=document.getElementById('bmsgTagFilterLabel');
  const resetFilters=document.getElementById('bmsgResetFilters');
  const key='starsbase-bmsg-fab-position-v1';
  let currentArtist='',requestNumber=0,artistVideos=[],artistFolders=[],activeTag='ALL',activeType='ALL';
  function clamp(n,a,b){return Math.max(a,Math.min(n,b));}
  function place(x,y){fab.style.left=clamp(x,4,window.innerWidth-fab.offsetWidth-4)+'px';fab.style.top=clamp(y,4,window.innerHeight-fab.offsetHeight-4)+'px';}
  try{const saved=JSON.parse(localStorage.getItem(key));if(Number.isFinite(saved?.x)&&Number.isFinite(saved?.y))place(saved.x,saved.y);}catch(e){}
  window.addEventListener('resize',()=>place(fab.offsetLeft,fab.offsetTop));
  let drag=null;
  fab.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:fab.offsetLeft,top:fab.offsetTop,moved:false};fab.setPointerCapture(e.pointerId);e.preventDefault();});
  fab.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.moved)place(drag.left+dx,drag.top+dy);});
  function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const moved=drag.moved;drag=null;if(moved){try{localStorage.setItem(key,JSON.stringify({x:fab.offsetLeft,y:fab.offsetTop}));}catch(err){}}else{overlay.hidden=false;close.focus();}}
  fab.addEventListener('pointerup',endDrag);
  fab.addEventListener('pointercancel',()=>{drag=null;});
  function hideMenu(){overlay.hidden=true;fab.focus();}
  close.addEventListener('click',hideMenu);
  overlay.addEventListener('click',e=>{if(e.target===overlay)hideMenu();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)hideMenu();});
  function showHome(){closeFolderModal();requestNumber++;currentArtist='';page.hidden=true;header.hidden=false;main.hidden=false;footer.hidden=false;window.scrollTo(0,0);}
  const TYPE_ORDER=['Music Video','Lyric Video','Live','Teaser','Teaser Pt2','Dance Performance','Mic Performance','Dance Practice','Yakatabune Party','Behind The Scenes (Short Ver.)','ダンプラ'];
  const COMING_ORDER=['RUI','TAIKI','KANON','GOICHI','ADAM'];
  function normalizedType(type){return String(type||'').trim().toLowerCase();}
  function typeRank(type){const i=TYPE_ORDER.findIndex(x=>normalizedType(x)===normalizedType(type));return i<0?TYPE_ORDER.length:i;}
  function isSpecial(type){return currentArtist==='STARGLOW'&&['SG LAB','STARGLOW IS COMING'].includes(String(type||'').trim());}
  // Folder assignments are authoritative. Never infer folders from titles or tags.
  function folderFor(v){
    const id=Number(v.folder_id);
    return Number.isSafeInteger(id)&&id>0?id:null;
  }
  function numberInTitle(title){const m=String(title||'').match(/#\s*(\d+)/);return m?Number(m[1]):Number.POSITIVE_INFINITY;}
  function specialRank(v){
    if(v.category==='SG LAB')return numberInTitle(v.title);
    if(v.category==='STARGLOW IS COMING'){
      const name=String(v.title||'').toUpperCase();
      const i=COMING_ORDER.findIndex(member=>new RegExp('(^|[^A-Z])'+member+'(?=$|[^A-Z])').test(name));
      return i<0?COMING_ORDER.length:i;
    }
    return 0;
  }
  function makeFilterButton(name,kind){
    const active=kind==='tag'?activeTag:activeType;
    const b=document.createElement('button');b.type='button';b.className='bmsg-filter';b.textContent=name==='ALL'?'すべて':name;
    b.setAttribute('aria-pressed',String(active===name));
    b.addEventListener('click',()=>{if(kind==='tag')activeTag=name;else activeType=name;renderVideos();});return b;
  }
  resetFilters.addEventListener('click',()=>{activeTag='ALL';activeType='ALL';renderVideos();});
  function createVideoCard(v){
    if(!/^[\w-]{11}$/.test(v.video_id))return null;
    const card=document.createElement('article');card.className='bmsg-video-card';
    const link=document.createElement('a');link.className='bmsg-video-link';link.href='https://www.youtube.com/watch?v='+encodeURIComponent(v.video_id);link.target='_blank';link.rel='noopener noreferrer';
    const img=document.createElement('img');img.className='bmsg-video-thumb';img.src='https://i.ytimg.com/vi/'+v.video_id+'/hqdefault.jpg';img.alt='';img.loading='lazy';
    const body=document.createElement('div');body.className='bmsg-video-body';
    const title=document.createElement('h3');title.className='bmsg-video-title';
    title.textContent=String(v.display_title||v.title||v.original_title||'動画').trim();
    body.append(title);
    if(Array.isArray(v.tags)&&v.tags.length){const tagbox=document.createElement('div');tagbox.className='bmsg-video-tags';for(const t of v.tags){const label=document.createElement('span');label.className='bmsg-video-tag';label.textContent='#'+t;tagbox.append(label);}body.append(tagbox);}
    link.append(img,body);card.append(link);return card;
  }
  function renderVideos(){
    grid.replaceChildren();folderNav.replaceChildren();filters.replaceChildren();typeFilters.replaceChildren();
    const types=[...new Set(artistVideos.map(v=>String(v.category||'').trim()).filter(Boolean))].sort((a,b)=>typeRank(a)-typeRank(b)||a.localeCompare(b,'ja'));
    typeFilters.append(makeFilterButton('ALL','type'));
    for(const type of types)typeFilters.append(makeFilterButton(type,'type'));
    const tags=[...new Set(artistVideos.flatMap(v=>Array.isArray(v.tags)?v.tags:[]))].sort((a,b)=>a.localeCompare(b,'ja'));
    filters.hidden=true;tagLabel.hidden=true;typeFilters.hidden=true;
    if(tags.length){filters.append(makeFilterButton('ALL','tag'));for(const tag of tags)filters.append(makeFilterButton(tag,'tag'));}
    resetFilters.hidden=true;
    const videos=artistVideos.filter(v=>folderFor(v)!==null&&(activeType==='ALL'||v.category===activeType)&&(activeTag==='ALL'||(v.tags||[]).includes(activeTag))&&/^[\w-]{11}$/.test(v.video_id));
    status.textContent=artistFolders.length+' FOLDERS · '+videos.length+' VIDEOS';
    empty.hidden=artistFolders.length>0;
    if(!artistFolders.length)empty.textContent='フォルダがまだ登録されていません。管理画面の登録内容をご確認ください。';
    // Show only videos explicitly assigned to an existing folder.
    const groups=new Map(artistFolders.map(f=>[Number(f.id),[]]));
    for(const v of videos){const id=folderFor(v);if(groups.has(id))groups.get(id).push(v);}
    for(const folder of artistFolders){
      const items=groups.get(Number(folder.id))||[];
      // Keep every registered folder visible, even when it currently has no assigned videos.
      items.sort((a,b)=>{const ai=a.folder_video_order,bi=b.folder_video_order;return (ai==null?999999:ai)-(bi==null?999999:bi)||Number(a.sort_order||0)-Number(b.sort_order||0);});
      const tile=document.createElement('button');tile.type='button';tile.className='bmsg-jacket-tile';tile.setAttribute('aria-label',folder.name+' の動画を開く');
      const art=document.createElement('span');art.className='bmsg-jacket-art';
      const fallback=()=>{art.replaceChildren();const wrap=document.createElement('span');wrap.className='bmsg-jacket-fallback';const mark=document.createElement('span');mark.className='bmsg-jacket-fallback-mark';mark.textContent='STARS BASE';const sub=document.createElement('span');sub.className='bmsg-jacket-fallback-small';sub.textContent='ARTIST COLLECTION';wrap.append(mark,sub);art.append(wrap);};
      if(typeof folder.cover_url==='string'&&folder.cover_url.startsWith(ADMIN_PUBLIC_API+'/api/folder-cover/')){
        const image=document.createElement('img');image.className='bmsg-jacket-image';image.src=folder.cover_url;image.alt='';image.loading='lazy';image.addEventListener('error',fallback,{once:true});art.append(image);
      }else fallback();
      const name=document.createElement('span');name.className='bmsg-jacket-name';name.textContent=folder.name;
      const count=document.createElement('span');count.className='bmsg-jacket-count';count.textContent=items.length+' VIDEOS';
      tile.append(art,name,count);tile.addEventListener('click',()=>openFolderModal(folder,items,tile));grid.append(tile);
    }
  }
  async function showArtist(name){
    closeFolderModal();const thisRequest=++requestNumber;currentArtist=name;activeTag='ALL';activeType='ALL';artistVideos=[];artistFolders=[];
    pageTitle.textContent=name;overlay.hidden=true;header.hidden=true;main.hidden=true;footer.hidden=true;page.hidden=false;
    grid.replaceChildren();folderNav.replaceChildren();filters.hidden=true;tagLabel.hidden=true;typeFilters.replaceChildren();resetFilters.hidden=true;empty.hidden=true;status.textContent='動画を読み込んでいます...';window.scrollTo(0,0);
    try{
      const response=await fetch(ADMIN_PUBLIC_API+'/api/videos?artist='+encodeURIComponent(name),{cache:'no-store'});
      if(!response.ok){let detail='';try{const err=await response.json();detail=err.error||err.message||'';}catch(_e){}throw new Error('API '+response.status+(detail?'：'+detail:''));}
      const data=await response.json();
      if(thisRequest!==requestNumber)return;
      artistVideos=Array.isArray(data.videos)?data.videos:[];
      if(!Array.isArray(data.folders))throw new Error('APIからフォルダ一覧が返されていません');
      artistFolders=data.folders;
      renderVideos();
    }catch(e){if(thisRequest!==requestNumber)return;console.error('BMSG artist loading error:',e);status.textContent='読み込みエラー';empty.hidden=false;empty.textContent='動画を表示できませんでした：'+String(e && e.message || e);}
  }

/* ========================================

function formatNumber(number) {

  return Number(
    number || 0
  ).toLocaleString(
    "ja-JP"
  );

}


function formatChange(
  value,
  unit = ""
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "―";
  }

  const sign =
    value >= 0
      ? "+"
      : "";

  return (
    sign +
    formatNumber(value) +
    unit
  );

}


/* ========================================
   日付
   ======================================== */

function formatShortDate(dateString) {

  if (!dateString) {
    return "";
  }

  const parts =
    dateString.split("-");

  if (parts.length !== 3) {
    return dateString;
  }

  return (
    Number(parts[1]) +
    "/" +
    Number(parts[2])
  );

}

/* ========================================
   目標
   ======================================== */

function getGoal(views) {

  const goals = [
    100000,
    200000,
    300000,
    400000,
    500000,
    1000000
  ];

  for (
    const goal of goals
  ) {

    if (views < goal) {
      return goal;
    }

  }

  return (
    Math.floor(
      views / 1000000
    ) + 1
  ) * 1000000;

}


function goalLabel(goal) {

  return (
    goal / 10000
  ).toLocaleString(
    "ja-JP"
  ) + "万";

}


function getPreviousGoal(goal) {

  if (goal === 100000) {
    return 0;
  }

  if (goal <= 500000) {
    return goal - 100000;
  }

  if (goal === 1000000) {
    return 500000;
  }

  return goal - 1000000;

}


/* ========================================
   達成予測
   ======================================== */

function formatPredictionDate(date) {

  const parts =
    new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone:
          "Asia/Tokyo",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false
      }
    ).formatToParts(date);


  const get =
    type =>
      parts.find(
        part =>
          part.type === type
      )?.value || "";


  return (
    get("year") +
    "/" +
    get("month") +
    "/" +
    get("day") +
    " " +
    get("hour") +
    ":" +
    get("minute")
  );

}


function getPaceData(
  video,
  goal
) {

  const sixHourAverage =
    Number(
      video.six_hour_pace
        ?.views_per_hour
    );


  if (
    !Number.isFinite(
      sixHourAverage
    ) ||
    sixHourAverage <= 0
  ) {

    return {
      type:
        "calculating",

      label:
        "ペース算出中",

      arrows:
        "",

      prediction:
        null
    };

  }


  const remaining =
    Math.max(
      goal -
      Number(
        video.views || 0
      ),
      0
    );


  const hoursNeeded =
    remaining /
    sixHourAverage;


  const prediction =
    new Date(
      Date.now() +
      hoursNeeded *
      60 *
      60 *
      1000
    );


  const previousDayViews =
    Number(
      video.previous_day_total
        ?.views
    );


  if (
    !Number.isFinite(
      previousDayViews
    ) ||
    previousDayViews <= 0
  ) {

    return {
      type:
        "steady",

      label:
        "ペース維持中",

      arrows:
        "→ → → → →",

      prediction
    };

  }


  const baselineHourly =
    previousDayViews / 24;


  const changeRate =
    (
      sixHourAverage -
      baselineHourly
    ) /
    baselineHourly;


  if (
    changeRate > 0.05
  ) {

    return {
      type:
        "up",

      label:
        "ペースアップ中",

      arrows:
        "↑ ↑ ↑ ↑ ↑",

      prediction
    };

  }


  if (
    changeRate < -0.05
  ) {

    return {
      type:
        "down",

      label:
        "ペースダウン中",

      arrows:
        "↓ ↓ ↓ ↓ ↓",

      prediction
    };

  }


  return {
    type:
      "steady",

    label:
      "ペース維持中",

    arrows:
      "→ → → → →",

    prediction
  };

}


function createPaceForecast(
  video,
  goal
) {

  const pace =
    getPaceData(
      video,
      goal
    );


  const predictionText =
    pace.prediction
      ? formatPredictionDate(
          pace.prediction
        )
      : "算出中";


  return `
    <div class="pace-box pace-${pace.type}">

      <div
        class="pace-arrow-bg"
        aria-hidden="true"
      >
        ${pace.arrows}
      </div>

      <div class="pace-content">

        <span class="pace-status">
          ${pace.label}
        </span>

        <span class="pace-prediction">
          📊達成予測：${predictionText}
        </span>

      </div>

    </div>
  `;

}


function createGoal(video) {

  const goal =
    getGoal(
      video.views
    );

  const previousGoal =
    getPreviousGoal(
      goal
    );

  const remaining =
    Math.max(
      goal -
      video.views,
      0
    );

  const range =
    goal -
    previousGoal;

  const progress =
    video.views -
    previousGoal;

  const percent =
    Math.max(
      0,
      Math.min(
        progress /
        range *
        100,
        100
      )
    );

  const nearGoal =
    percent >= 90
      ? `<span class="goal-near">❤️‍🔥</span>`
      : "";

  return `
    <div class="goal">

      <div class="goal-text">
        ${goalLabel(goal)}回再生まで
        あと${formatNumber(remaining)}回
        ${nearGoal}
      </div>

      ${createPaceForecast(
        video,
        goal
      )}

      <div class="progress">

        <div
          class="progress-bar"
          style="width:${percent}%"
        ></div>

      </div>

      <div class="progress-percent">
        ${percent.toFixed(1)}%
      </div>

    </div>
  `;

}

/* ========================================
   日別グラフ
   ======================================== */

function drawHistory(history) {

  const dates = [
    ...new Set(
      history.map(
        item =>
          item.jst_date
      )
    )
  ];


  const datasets =
    VIDEO_ORDER.map(
      title => {

        const rows =
          history.filter(
            item =>
              item.title ===
              title
          );

        const values =
          dates.map(
            date => {

              const row =
                rows.find(
                  item =>
                    item.jst_date ===
                    date
                );

              return row
                ? Number(
                    row.end_views
                  )
                : null;

            }
          );


        return {
          label: title,
          data: values,
          tension: 0.25,
          spanGaps: true,
          borderWidth: 2,
          pointRadius: 3
        };

      }
    );


  if (
    historyChart
  ) {
    historyChart.destroy();
  }


  const ctx =
    document.getElementById(
      "historyChart"
    );


  historyChart =
    new Chart(
      ctx,
      {

        type: "line",

        data: {
          labels: dates,
          datasets
        },

        options: {

          responsive: true,

          maintainAspectRatio:
            false,

          interaction: {
            mode: "index",
            intersect: false
          },

          plugins: {

            legend: {
              position: "bottom",

              labels: {
                boxWidth: 12,
                padding: 14
              }
            },

            tooltip: {

              callbacks: {

                label(context) {

                  const value =
                    context.parsed.y;

                  if (
                    value === null
                  ) {
                    return "";
                  }

                  return (
                    context.dataset.label +
                    "：" +
                    formatNumber(value) +
                    "回"
                  );

                }

              }

            }

          },

          scales: {

            y: {

              ticks: {

                callback(value) {

                  return Number(
                    value
                  ).toLocaleString(
                    "ja-JP",
                    {
                      notation:
                        "compact"
                    }
                  );

                }

              }

            },

            x: {

              ticks: {
                maxRotation: 0
              }

            }

          }

        }

      }
    );

}


/* ========================================
   データ取得
   ======================================== */

// Preview only: PIECES comes from the isolated test Worker, not the production statistics Worker.
// The test Worker currently exposes /stats and /history; no hourly history endpoint exists.
async function loadPiecesPreview() {
  const [statsResponse, historyResponse] = await Promise.all([
    fetch(PIECES_TEST_API + '/stats?t=' + Date.now(), {cache:'no-store'}),
    fetch(PIECES_TEST_API + '/history?t=' + Date.now(), {cache:'no-store'})
  ]);
  if (!statsResponse.ok || !historyResponse.ok) throw new Error('PIECES test API error');
  const [statsData, historyData] = await Promise.all([statsResponse.json(),historyResponse.json()]);
  const stats=statsData.stats;
  if (!statsData.ok || !historyData.ok || !stats || stats.video_id !== PIECES_VIDEO_ID)
    throw new Error('PIECES data unavailable');
  const daily=(Array.isArray(historyData.daily)?historyData.daily:[])
    .filter(row=>row.video_id===PIECES_VIDEO_ID && /^\d{4}-\d{2}-\d{2}$/.test(row.recorded_date))
    .sort((a,b)=>a.recorded_date.localeCompare(b.recorded_date));
  const jstToday=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const yesterday=daily.filter(row=>row.recorded_date<jstToday).at(-1);
  const dayBefore=yesterday?daily.filter(row=>row.recorded_date<yesterday.recorded_date).at(-1):null;
  const views=Number(stats.views),likes=Number(stats.likes);
  if (!Number.isFinite(views)||!Number.isFinite(likes)) throw new Error('PIECES invalid stats');
  const video={
    id:PIECES_VIDEO_ID,title:'PIECES',views,likes,
    hourly_change:null, // The test API does not expose hourly snapshots yet.
    daily_change:yesterday&&dayBefore?{
      views:Number(yesterday.views)-Number(dayBefore.views),
      likes:Number(yesterday.likes)-Number(dayBefore.likes)
    }:null,
    today_change:yesterday?{
      views:views-Number(yesterday.views),likes:likes-Number(yesterday.likes)
    }:null,
    previous_day_total:yesterday?{
      date:yesterday.recorded_date,
      views:yesterday&&dayBefore?Number(yesterday.views)-Number(dayBefore.views):null,
      likes:yesterday&&dayBefore?Number(yesterday.likes)-Number(dayBefore.likes):null
    }:null,
    six_hour_pace:null,
    preview_test:true
  };
  // Daily test snapshots are provisional until the day ends; only past dates appear in chart.
  const history=daily.filter(row=>row.recorded_date<jstToday).map(row=>({
    title:'PIECES',jst_date:row.recorded_date,end_views:Number(row.views)
  }));
  return {video,history};
}

async function loadData() {

  const cards =
    document.getElementById(
      "cards"
    );

  try {

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    if (
      !response.ok
    ) {

      throw new Error(
        "API error"
      );

    }

    const data =
      await response.json();


    showUpdatedTime(
      data.updated_at
    );


    // A failed PIECES preview request must not break the six existing production cards.
    const allVideos=[...data.videos];
    let allHistory=[...(data.daily_history||[])];
    try {
      const pieces=await loadPiecesPreview();
      const existing=allVideos.findIndex(v=>v.id===PIECES_VIDEO_ID || v.title==='PIECES');
      if(existing>=0) allVideos.splice(existing,1);
      allVideos.push(pieces.video);
      allHistory=allHistory.filter(row=>row.title!=='PIECES').concat(pieces.history);
    } catch (piecesError) {
      console.warn('PIECES preview is unavailable:',piecesError);
      // If PIECES is absent from production, show an honest unavailable card instead of fake counts.
      if(!allVideos.some(v=>v.id===PIECES_VIDEO_ID || v.title==='PIECES')) {
        allVideos.push({id:PIECES_VIDEO_ID,title:'PIECES',views:0,likes:0,
          preview_unavailable:true});
      }
    }
    const sortedVideos=allVideos.sort((a,b)=>{
      const ai=VIDEO_ORDER.indexOf(a.title),bi=VIDEO_ORDER.indexOf(b.title);
      return (ai<0?999:ai)-(bi<0?999:bi);
    });

    createMilestoneAlerts(
      sortedVideos
    );


    cards.innerHTML =
      sortedVideos
        .map(video => video.preview_unavailable
          ? `<article class="card"><h2 class="title">PIECES</h2><p>テスト用データを取得できませんでした。再読み込みしてください。</p></article>`
          : createCard(video))
        .join("");


    drawHistory(allHistory);

  } catch (error) {

    console.error(
      error
    );

    cards.innerHTML = `
      <div class="error">
        データを取得できませんでした。<br>
        少し時間を置いて再読み込みしてください。
      </div>
    `;

  }

}


/* ========================================
   起動
   ======================================== */

loadData();

loadRecentPlays();


/* リアルタイム欄：10秒ごと */

setInterval(
  loadRecentPlays,
  10000
);


/* MVデータ：5分ごと */

setInterval(
  loadData,
  300000
);

</script>
