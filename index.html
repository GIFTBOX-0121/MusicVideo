


<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STARS BASE</title>

  <meta name="description" content=" ">
  <meta property="og:title" content="STARS BASE">
  <meta property="og:description" content=" ">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(72, 98, 160, 0.30) 0%,
          rgba(72, 98, 160, 0) 42%
        ),
        linear-gradient(
          180deg,
          #0d1b3d 0%,
          #142b55 42%,
          #202550 100%
        );

      background-attachment: fixed;

      color: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    /* ========================================
       星が降る背景
       ======================================== */

    #star-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .falling-star {
      position: absolute;
      top: -40px;

      color: rgba(255, 221, 87, 0.98);

      text-shadow:
        0 0 5px rgba(255, 226, 105, 0.95),
        0 0 12px rgba(255, 202, 40, 0.72);

      user-select: none;

      animation:
        starFall linear forwards,
        starTwinkle 1.8s ease-in-out infinite alternate;

      will-change: transform, opacity;
    }

    @keyframes starFall {
      0% {
        transform: translate3d(0, -40px, 0) rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      90% {
        opacity: 0.9;
      }

      100% {
        transform: translate3d(35px, 110vh, 0) rotate(180deg);
        opacity: 0;
      }
    }

    @keyframes starTwinkle {
      from {
        filter: brightness(0.8);
      }

      to {
        filter: brightness(1.5);
      }
    }

    /* ========================================
       サイト本体
       ======================================== */

    .container {
      position: relative;
      z-index: 1;

      width: min(94%, 760px);
      margin: 0 auto;

      padding: 30px 0 40px;
    }

    /* ========================================
       ヘッダー
       ======================================== */

    header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: 14px;

      margin-bottom: 22px;

      color: #fff;
    }

    .header-left {
      padding-top: 5px;
      text-align: left;
    }

    header h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;

      color: #fff;

      white-space: nowrap;

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.22);
    }

    .updated {
      margin-top: 8px;

      color: rgba(255, 255, 255, 0.74);

      font-size: 12px;
    }

    /* ========================================
       リアルタイム再生履歴
       ======================================== */

    .realtime {
      min-width: 0;
      text-align: left;
      color: rgba(255, 255, 255, 0.88);
    }

    .realtime-title {
      margin-bottom: 4px;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
    }

    .realtime-list {
      display: grid;
      gap: 1px;
    }

    .realtime-item {
      overflow: hidden;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: rgba(255, 255, 255, 0.74);
    }

    .realtime-empty {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.48);
      text-align: center;
    }

    /* ========================================
       キリ番間近
       ======================================== */

    .milestone-alerts {
      display: grid;
      gap: 7px;
      margin-bottom: 18px;
    }

    .milestone-alert {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 7px 7px 7px 10px;
      border: 2px solid #e53935;
      border-radius: 10px;
      background: rgba(255, 245, 245, 0.97);
      color: #d32f2f;
    }

    .milestone-message {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .milestone-play {
      flex-shrink: 0;
      margin-left: 7px;
      padding: 6px 8px;
      border-radius: 7px;
      background: #e53935;
      color: #fff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .prediction-note {
      margin: 24px 0 14px;
      text-align: center;
      color: rgba(255, 255, 255, 0.72);
      font-size: 10px;
      line-height: 1.5;
    }

    /* ========================================
       RANDOM VIDEO
       ======================================== */

    .random-video {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      margin: 0 0 16px;
      padding: 9px 12px;

      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      color: #fff;
    }

    .random-label {
      flex-shrink: 0;

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.7px;

      white-space: nowrap;
    }

    .random-stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .random-star {
      appearance: none;
      -webkit-appearance: none;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 27px;
      height: 27px;
      padding: 0;

      border: 0;
      background: transparent;

      color: #ffe45c;

      font-size: 24px;
      line-height: 1;

      cursor: pointer;

      text-shadow:
        0 0 5px rgba(255, 226, 105, 0.75),
        0 0 10px rgba(255, 202, 40, 0.45);

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .random-star:active {
      transform: scale(0.78);
      filter: brightness(1.5);
    }

    /* ========================================
       FEATURED VIDEO
       ======================================== */

    .featured-videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 18px;
    }

    .featured-video {
      min-width: 0;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .featured-video a {
      display: block;
      color: #111;
      text-decoration: none;
    }

    .featured-thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #eee;
    }

    .featured-text {
      padding: 7px 8px 8px;
      min-width: 0;
    }

    .featured-group,
    .featured-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .featured-group {
      font-size: 9px;
      font-weight: 700;
      color: #777;
      line-height: 1.35;
    }

    .featured-title {
      margin-top: 2px;
      font-size: 11px;
      font-weight: 900;
      color: #111;
      line-height: 1.35;
    }

    /* ========================================
       MVカード
       ======================================== */

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .video-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .thumbnail {
      width: 135px;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
    }

    .video-info {
      min-width: 0;
      flex: 1;
    }

    .title {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .trending {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 9px;
      border: 2px solid #e53935;
      border-radius: 8px;
      color: #d32f2f;
      background: #fff5f5;
      font-size: 12px;
      font-weight: 800;
    }

    .youtube-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 13px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    /* ========================================
       再生回数・高評価
       ======================================== */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      text-align: center;
      min-width: 0;
    }

    .stat + .stat {
      border-left: 1px solid #e8e8e8;
    }

    .stat-label {
      margin-bottom: 6px;
      font-size: 12px;
      color: #777;
    }

    .stat-number {
      font-size: clamp(20px, 6vw, 30px);
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
    }

    .changes {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.8;
    }

    .change-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .change-label {
      color: #888;
    }

    .change-number {
      font-weight: 700;
    }

    .change-box {
      width: 92%;
      margin: 5px auto 9px;
      padding: 5px 6px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      background: #f8f8f8;
      color: #555;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }

    /* ========================================
       目標
       ======================================== */

    .goal {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .goal-text {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .goal-near {
      margin-left: 4px;
    }

    /* ========================================
       達成予測
       ======================================== */

    .pace-box {
      position: relative;
      overflow: hidden;

      margin: 10px auto 4px;
      padding: 7px 10px;

      border: 2px solid;
      border-radius: 9px;

      text-align: center;
    }

    .pace-up {
      border-color: #e53935;
      background: #fff5f5;
      color: #c62828;
    }

    .pace-steady {
      border-color: #43a047;
      background: #f3fff4;
      color: #2e7d32;
    }

    .pace-down {
      border-color: #1e88e5;
      background: #f3f8ff;
      color: #1565c0;
    }

    .pace-calculating {
      border-color: #999;
      background: #f8f8f8;
      color: #666;
    }

    .pace-arrow-bg {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;

      width: max-content;

      opacity: 0.09;

      font-size: 25px;
      font-weight: 900;
      letter-spacing: 7px;

      white-space: nowrap;

      animation: paceMove 4s linear infinite;
    }

    @keyframes paceMove {
      from {
        transform: translateX(-10%);
      }

      to {
        transform: translateX(10%);
      }
    }

    .pace-content {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: 4px 9px;
    }

    .pace-status {
      font-size: 11px;
      font-weight: 900;
    }

    .pace-prediction {
      font-size: 9.5px;
      font-weight: 700;
    }

    .progress {
      width: 100%;
      height: 12px;
      margin-top: 11px;
      overflow: hidden;
      background: #ececec;
      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      background: #111;
      border-radius: 999px;
      transition: width .5s ease;
    }

    .progress-percent {
      margin-top: 6px;
      text-align: right;
      font-size: 12px;
      color: #777;
    }

    /* ========================================
       グラフ
       ======================================== */

    .chart-card {
      margin-top: 26px;
      padding: 22px 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .chart-title {
      margin: 0 0 20px;
      text-align: center;
      font-size: 18px;
    }

    .chart-wrap {
      position: relative;
      height: 390px;
    }

    .footer {
      margin-top: 34px;
      padding-bottom: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.55);
    }

    .loading {
      padding: 60px 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.75);
    }

    .error {
      padding: 30px 15px;
      text-align: center;
      color: #b00020;
      background: #fff;
      border-radius: 18px;
    }

    @media (max-width: 420px) {

      .container {
        width: 95%;
      }

      header {
        grid-template-columns: 46% 54%;
        gap: 5px;
      }

      header h1 {
        font-size: 22px;
        letter-spacing: 0.7px;
      }

      .updated {
        font-size: 10px;
      }

      .realtime-title {
        font-size: 9px;
      }

      .realtime-item {
        font-size: 8.5px;
      }

      .milestone-message {
        font-size: 10.5px;
      }

      .milestone-play {
        margin-left: 5px;
        padding: 6px 7px;
        font-size: 9px;
      }

      .prediction-note {
        margin-top: 22px;
        font-size: 9px;
      }

      .random-video {
        gap: 6px;
        padding: 8px 7px;
      }

      .random-label {
        font-size: 9.5px;
        letter-spacing: 0.3px;
      }

      .random-stars {
        gap: 3px;
      }

      .random-star {
        width: 25px;
        height: 25px;
        font-size: 22px;
      }

      .card {
        padding: 14px;
      }

      .thumbnail {
        width: 120px;
      }

      .title {
        font-size: 18px;
      }

      .youtube-button {
        font-size: 11px;
        padding: 7px 10px;
      }

      .stat-number {
        font-size: 21px;
      }

      .changes {
        font-size: 11px;
      }

      .change-box {
        width: 96%;
        font-size: 9.5px;
        padding: 5px 4px;
      }

      .pace-status {
        font-size: 10px;
      }

      .pace-prediction {
        font-size: 9px;
      }

      .chart-wrap {
        height: 350px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .falling-star,
      .pace-arrow-bg {
        animation: none;
      }
    }


    /* BMSG artist collection — isolated from statistics */
    .bmsg-fab{position:fixed;left:calc(100vw - 82px);top:42%;width:64px;height:64px;border-radius:50%;border:none;background:#050505;color:#fff;box-shadow:0 4px 18px #0009;z-index:1100;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:-.5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
    /* BMSG floating button — larger aurora sparkle ring */
    .bmsg-fab{width:80px;height:80px;left:calc(100vw - 98px);font-size:14px;background:linear-gradient(#080a13,#080a13) padding-box,conic-gradient(from 0deg,#ffffff,#aab8ed,#f8faff,#c99df3,#ffffff,#93b9ed,#ffffff) border-box;border:3px solid transparent;box-shadow:0 0 0 2px #ffffff35,0 0 18px #b5a4ef88,0 4px 20px #000b;animation:bmsgAura 7s ease-in-out infinite;}
    .bmsg-fab::after{content:'✦';position:absolute;top:-11px;right:6px;color:white;font-size:19px;text-shadow:0 0 9px #fff,0 0 15px #b7a2ff;pointer-events:none;}
    .bmsg-fab:active{cursor:grabbing}.bmsg-fab span{border:none;padding:3px 4px;pointer-events:none;text-shadow:0 0 9px #ffffff66}
    @keyframes bmsgAura{0%,100%{box-shadow:0 0 0 2px #ffffff35,0 0 12px #b5a4ef88,0 4px 20px #000b}50%{box-shadow:0 0 0 2px #ffffff77,0 0 25px #c8b7ffbb,0 4px 20px #000b}}
    @media(max-width:420px){.bmsg-fab{width:74px;height:74px;font-size:14px}}
    @media(prefers-reduced-motion:reduce){.bmsg-fab{animation:none}}
    .bmsg-overlay[hidden],.bmsg-artist-page[hidden]{display:none!important}
    .bmsg-overlay{position:fixed;inset:0;z-index:1200;background:rgba(3,8,24,.77);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .bmsg-dialog{width:min(100%,430px);max-height:85dvh;overflow:auto;background:linear-gradient(150deg,#15284d,#0b1027);color:white;border:1px solid #ffffff45;border-radius:22px;padding:20px;box-shadow:0 18px 50px #0009}
    .bmsg-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.bmsg-dialog-head h2{margin:0;font-size:18px;letter-spacing:2px}
    .bmsg-close,.bmsg-back{border:1px solid #ffffff55;border-radius:999px;background:#ffffff16;color:#fff;cursor:pointer;padding:9px 14px;font-weight:700}
    .bmsg-artist-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .bmsg-menu-featured{grid-column:1/-1;width:100%;min-height:55px;font-size:15px;letter-spacing:.07em;background:linear-gradient(110deg,#344d86,#172c5c);border:1px solid #b9c9f788}
    .bmsg-menu-columns{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
    .bmsg-menu-column{display:flex;flex-direction:column;gap:9px;min-width:0}
    .bmsg-menu-heading{font-size:11px;letter-spacing:.12em;color:#dce5ff;font-weight:900;min-height:19px;margin:0 0 3px 2px}
    .bmsg-menu-column .bmsg-artist-choice{width:100%;overflow-wrap:anywhere}
    .bmsg-artist-choice{min-height:45px;border:1px solid #ffffff40;border-radius:11px;background:#ffffff12;color:white;font-size:12px;font-weight:800;cursor:pointer;padding:9px 5px}
    .bmsg-artist-choice:active{background:#ffffff38}
    .bmsg-artist-page{position:relative;z-index:2;min-height:65vh;color:#fff;padding:12px 0 32px}
    .bmsg-page-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.bmsg-page-head h2{font-size:clamp(19px,5vw,28px);margin:0;overflow-wrap:anywhere}
    .bmsg-page-note{color:#ffffffc7;font-size:13px;line-height:1.8;padding:22px;border:1px solid #ffffff30;border-radius:14px;background:#ffffff0b}
    .bmsg-page-status{color:#d5dcf0;font-size:12px;margin:0 0 12px}
    .bmsg-filter-list{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
    .bmsg-filter{border:1px solid #ffffff55;border-radius:999px;background:#ffffff13;color:white;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer}
    .bmsg-filter[aria-pressed="true"]{background:#fff;color:#14213c;border-color:#fff}
    .bmsg-video-grid{display:flex;flex-direction:column;gap:22px}
    .bmsg-song-group{min-width:0;border:1px solid #b9c9f744;border-radius:12px;overflow:hidden;background:#ffffff08}
    .bmsg-song-group[open] .bmsg-song-heading{border-bottom:1px solid #b9c9f755}
    .bmsg-song-group summary{list-style:none;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
    .bmsg-song-group summary::-webkit-details-marker{display:none}
    .bmsg-song-group summary:after{content:'＋';float:right;font-size:18px;line-height:1.2}
    .bmsg-song-group[open] summary:after{content:'－'}
    .bmsg-song-heading{margin:0;padding:12px 14px;text-align:center;font-size:15px;font-weight:900;line-height:1.5;overflow-wrap:anywhere;background:linear-gradient(110deg,#344d86,#172c5c);border:1px solid #b9c9f788;border-radius:12px;color:white}
    .bmsg-song-videos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px}

    .bmsg-filter-label{color:#dce5ff;font-size:12px;font-weight:800;margin:10px 0 7px}
    .bmsg-filter-list{margin-bottom:12px}
    .bmsg-filter-reset{margin:0 0 15px}
    .bmsg-video-card{overflow:hidden;border:1px solid #ffffff2a;border-radius:13px;background:#ffffffed;color:#121625;min-width:0}
    .bmsg-video-link{display:block;color:inherit;text-decoration:none}
    .bmsg-video-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#dfe3ed}
    .bmsg-video-body{padding:7px 6px 9px}

<script>
/* FIRST WEEK: isolated 10-tile sheet. Existing features below are unchanged. */
(function initFirstWeek(){
 const ROOT='https://starsbase-artist-admin.starsx0601.workers.dev';
 const SLAM_ID='tFTeMdvyfBs';
 const STATE_KEY='starsbase-first-week-sheet-v1';
 const IMAGE_CACHE='starsbase-first-week-images-v1';
 const LINKS=[
  ...Array.from({length:6},()=>({kind:'mv',url:'https://youtu.be/tFTeMdvyfBs?si=fzehALlw6i11skaB'})),
  ...Array.from({length:2},()=>({kind:'channel',url:'https://youtube.com/@starglow_bmsg?si=KcLrHPECPV7GaC31'})),
  ...Array.from({length:2},()=>({kind:'youtube',url:'https://www.youtube.com/'}))
 ];
 const area=document.getElementById('firstWeekArea');
 const grid=document.getElementById('firstWeekGrid');
 const nextButton=document.getElementById('firstWeekNext');
 let imagePool=[];
 let sheetId=0;
 let state=null;
 const imageUrls=new Map();
 const imagePending=new Map();
 const shuffle=items=>{
  const out=[...items];
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  return out;
 };
 function save(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state));}catch(error){console.warn('FIRST WEEK save:',error);}}
 function read(){
  try{
   const saved=JSON.parse(localStorage.getItem(STATE_KEY));
   if(saved&&Number.isSafeInteger(saved.number)&&saved.number>=1&&Array.isArray(saved.tiles)&&saved.tiles.length===10&&
      saved.tiles.every(t=>t&&['mv','channel','youtube'].includes(t.kind)&&typeof t.url==='string'&&typeof t.opened==='boolean'&&
       (t.image===null||typeof t.image==='string'))&&
      saved.tiles.filter(t=>t.kind==='mv').length===6&&saved.tiles.filter(t=>t.kind==='channel').length===2&&saved.tiles.filter(t=>t.kind==='youtube').length===2){
    return saved;
   }
  }catch(error){console.warn('FIRST WEEK restore:',error);}
  return null;
 }
 // Cache image bytes on the device. A cached image is never downloaded again unless the browser evicts it.
 function cachedImage(url){
  if(imagePending.has(url))return imagePending.get(url);
  const pending=loadCachedImage(url);
  imagePending.set(url,pending);
  pending.finally(()=>imagePending.delete(url));
  return pending;
 }
 async function loadCachedImage(url){
  if(!url)return null;
  if(imageUrls.has(url))return imageUrls.get(url);
  if(!('caches' in window))return url;
  try{
   const cache=await caches.open(IMAGE_CACHE);
   let response=await cache.match(url);
   if(!response){
    const fetched=await fetch(url,{cache:'force-cache'});
    if(!fetched.ok)return url;
    response=fetched;
    await cache.put(url,fetched.clone());
   }
   const blob=await response.blob();
   const objectUrl=URL.createObjectURL(blob);
   imageUrls.set(url,objectUrl);
   return objectUrl;
  }catch(error){console.warn('FIRST WEEK image cache:',error);return url;}
 }
 function reveal(tile,entry){
  tile.classList.add('fw-revealed');
  tile.classList.toggle('fw-non-mv',entry.kind!=='mv');
  tile.replaceChildren();
  if(entry.kind==='mv'){
   // MV squares never turn into a star, even while their image is loading.
   if(!entry.image){tile.textContent='';return;}
   const picture=document.createElement('img');
   picture.alt='';picture.loading='eager';picture.decoding='async';
   tile.append(picture);
   if(imageUrls.has(entry.image))picture.src=imageUrls.get(entry.image);
   else cachedImage(entry.image).then(url=>{if(url&&picture.isConnected)picture.src=url;});
  }else{
   const star=document.createElement('span');star.className='fw-white-star';star.textContent='★';tile.append(star);
  }
 }
 function fillMissingImages(){
  if(!state||!imagePool.length)return;
  const used=new Set(state.tiles.filter(t=>t.kind==='mv'&&t.image).map(t=>t.image));
  const candidates=shuffle(imagePool.filter(url=>!used.has(url)));
  state.tiles.forEach(t=>{
   if(t.kind==='mv'&&!t.image){
    t.image=candidates.shift()||imagePool[Math.floor(Math.random()*imagePool.length)];
   }
  });
  save();
 }
 nextButton.addEventListener('click',()=>{if(state&&state.tiles.every(t=>t.opened))newSheet();});
 function newSheet(){
  const previous=state;
  const links=shuffle(LINKS);
  const images=shuffle(imagePool).slice(0,6);
  let imageIndex=0;
  state={number:previous?previous.number+1:1,tiles:links.map(link=>({
   kind:link.kind,url:link.url,image:link.kind==='mv'?(images[imageIndex++]||imagePool[Math.floor(Math.random()*imagePool.length)]||null):null,opened:false
  }))};
  save();
  renderSheet();
 }
 function renderSheet(){
  sheetId++;
  const currentSheet=sheetId;
  grid.replaceChildren();
  nextButton.hidden=!state.tiles.every(t=>t.opened);
  state.tiles.forEach((entry,index)=>{
   const tile=document.createElement('a');
   tile.className='fw-tile';tile.href=entry.url;tile.target='_blank';tile.rel='noopener noreferrer';
   tile.setAttribute('aria-label','星 '+(index+1)+' を開く');
   tile.textContent='★';
   if(entry.opened)reveal(tile,entry);
   tile.addEventListener('click',()=>{
    if(entry.opened)return;
    entry.opened=true;
    save(); // Save immediately, even if the browser closes before the visitor returns.
    if(entry.kind==='mv'){
     try{recordPlay(SLAM_ID);}catch(error){console.warn('FIRST WEEK play record:',error);}
    }
    let returned=false;
    const onFocus=()=>{
     if(returned||currentSheet!==sheetId)return;
     returned=true;
     window.removeEventListener('focus',onFocus);
     document.removeEventListener('visibilitychange',onVisibility);
     reveal(tile,entry);
     if(state.tiles.every(t=>t.opened))nextButton.hidden=false;
    };
    const onVisibility=()=>{if(!document.hidden)onFocus();};
    window.addEventListener('focus',onFocus);
    document.addEventListener('visibilitychange',onVisibility);
   });
   grid.append(tile);
  });
  // Prepare the six assigned pictures before the user returns from YouTube.
  state.tiles.filter(t=>t.kind==='mv'&&t.image).forEach(t=>{cachedImage(t.image).catch(()=>{});});
  // Keep completed sheet visible, including after a reload, until NEXT SHEET is pressed.
 }
 (async()=>{
  // FIRST WEEK stays visible throughout the campaign: no ON/OFF API request.
  area.hidden=false;
  state=read();
  if(state)renderSheet();
  try{
   const response=await fetch(ROOT+'/api/first-week/images',{cache:'no-store'});
   if(response.ok){
    const pool=await response.json();
    imagePool=Array.isArray(pool.images)?pool.images.filter(url=>typeof url==='string'&&url.startsWith(ROOT+'/api/first-week/images/file?')):[];
   }
  }catch(error){console.warn('FIRST WEEK images:',error);}
  // Never create the first sheet before image assignments are available.
  if(!state)newSheet();
  else{
   const missing=state.tiles.some(t=>t.kind==='mv'&&!t.image);
   if(missing){
    fillMissingImages();
    renderSheet();
   }
  }
 })();
})();

/* BMSG artist navigation — independent of existing statistics */
(function initBmsgNavigation(){
  const ADMIN_PUBLIC_API='https://starsbase-artist-admin.starsx0601.workers.dev';

  async function getGlobalVideos(){
    if(globalCache)return {videos:globalCache,partial:false};

      globalLoading=(async()=>{
        const responses=await Promise.allSettled(allArtists.map(async artist=>{
          const r=await fetch(ADMIN_PUBLIC_API+'/api/videos?artist='+encodeURIComponent(artist),{cache:'no-store'});
          if(!r.ok)throw new Error(artist+' API '+r.status);

          return data.videos.filter(v=>/^[\w-]{11}$/.test(String(v.video_id||''))).map(v=>({...v,artist}));
        }));
        const fulfilled=responses.filter(r=>r.status==='fulfilled');
        if(!fulfilled.length)throw new Error('アーティスト情報を取得できませんでした');
        const result=fulfilled.flatMap(r=>r.value);
        if(fulfilled.length===responses.length)globalCache=result;
        return {videos:result,partial:fulfilled.length!==responses.length};
      })().finally(()=>{globalLoading=null;});
    }
    const result=await globalLoading;
    return Array.isArray(result)?{videos:result,partial:false}:result;
  }
  const globalResults=document.getElementById('bmsgGlobalResults');
  const globalSort=document.getElementById('bmsgGlobalSort');
  const globalNewest=document.getElementById('bmsgGlobalNewest');
  const globalOldest=document.getElementById('bmsgGlobalOldest');

    globalResults.replaceChildren();globalResults.hidden=true;globalSort.hidden=true;
    globalStatus.textContent='';list.hidden=false;globalMatches=[];
  }
  function renderGlobalMatches(){
    globalResults.replaceChildren();
    const rows=sortByPublished(globalMatches,globalOrder==='oldest');
    for(const v of rows){
      const card=createVideoCard(v);if(!card)continue;
      const body=card.querySelector('.bmsg-video-body');
      if(body){const artist=document.createElement('span');artist.className='bmsg-global-artist-name';artist.textContent=v.artist;body.prepend(artist);
        if(v.published_at){const date=document.createElement('time');date.className='bmsg-vinyl-date';date.textContent='公開日 '+String(v.published_at).slice(0,10);body.append(date);}}
      globalResults.append(card);
    }
    globalNewest.setAttribute('aria-pressed',String(globalOrder==='newest'));
    globalOldest.setAttribute('aria-pressed',String(globalOrder==='oldest'));
  }
  function showGlobalMatches(videos,query,partial){
    globalMatches=videos.filter(v=>[v.display_title,v.title,v.original_title].some(t=>String(t||'').toLocaleLowerCase('ja').includes(query)));
    globalStatus.textContent=globalMatches.length+' 件の動画が見つかりました'+(partial?'（一部アーティストの取得に失敗）':'');
    list.hidden=true;globalResults.hidden=false;globalSort.hidden=globalMatches.length===0;
    renderGlobalMatches();
  }
  async function runGlobalSearch(){
    const query=globalSearch.value.trim().toLocaleLowerCase('ja');
    const seq=++globalSearchSeq;
    globalClear.hidden=!query;
    if(!query){resetGlobalSearch();return;}
    list.hidden=true;globalResults.hidden=false;globalResults.replaceChildren();globalSort.hidden=true;

      const data=await getGlobalVideos();
      if(seq!==globalSearchSeq||!globalSearch.value.trim())return;
      showGlobalMatches(data.videos,query,data.partial);
    }catch(err){if(seq===globalSearchSeq)globalStatus.textContent='検索できませんでした：'+err.message;}
  }
  globalSearch.addEventListener('input',()=>{clearTimeout(globalTimer);globalSearchSeq++;globalClear.hidden=!globalSearch.value;if(!globalSearch.value.trim()){resetGlobalSearch();return;}globalTimer=setTimeout(runGlobalSearch,450);});
  globalSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(globalTimer);runGlobalSearch();}});
  globalClear.addEventListener('click',()=>{clearTimeout(globalTimer);globalSearchSeq++;globalSearch.value='';globalClear.hidden=true;resetGlobalSearch();globalSearch.focus();});
  globalNewest.addEventListener('click',()=>{globalOrder='newest';renderGlobalMatches();});
  globalOldest.addEventListener('click',()=>{globalOrder='oldest';renderGlobalMatches();});
  const page=document.getElementById('bmsgArtistPage');
  const pageTitle=document.getElementById('bmsgPageTitle');
  const back=document.getElementById('bmsgBack');
  const main=document.getElementById('starsMain');
  const header=document.getElementById('starsHeader');
  const footer=document.getElementById('starsFooter');

  function sortByPublished(items,oldest=false){return [...items].sort((a,b)=>{const ad=dateValue(a),bd=dateValue(b);if(ad===null&&bd!==null)return 1;if(bd===null&&ad!==null)return -1;if(ad!==null&&bd!==null&&ad!==bd)return oldest?ad-bd:bd-ad;const tie=Number(a.sort_order||0)-Number(b.sort_order||0);return oldest?-tie:tie;});}

    sortNewest.setAttribute('aria-pressed',String(modalSort==='newest'));

  let lastFolderTrigger=null;

  folderModalClose.addEventListener('click',closeFolderModal);

  const empty=document.getElementById('bmsgPageEmpty');

  const key='starsbase-bmsg-fab-position-v1';
  let currentArtist='',requestNumber=0,artistVideos=[],artistFolders=[],activeTag='ALL',activeType='ALL';
  function clamp(n,a,b){return Math.max(a,Math.min(n,b));}

  ).toLocaleString(
    "ja-JP"
  );

}


function formatChange(
  value,
  unit = ""
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "―";
  }

  const sign =
    value >= 0
      ? "+"
      : "";

  return (
    sign +
    formatNumber(value) +
    unit
  );

}


/* ========================================
   日付
   ======================================== */

function formatShortDate(dateString) {

  if (!dateString) {
    return "";
  }

  const parts =
    dateString.split("-");

  if (parts.length !== 3) {
    return dateString;
  }

  return (
    Number(parts[1]) +
    "/" +
    Number(parts[2])
  );

}


/* ========================================
   リアルタイム
   ======================================== */

function formatPlayTime(iso) {

  return new Intl.DateTimeFormat(
    "ja-JP",
    {
      timeZone: "Asia/Tokyo",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }
  ).format(
    new Date(iso)
  );

}


async function loadRecentPlays() {

  const target =
    document.getElementById(
      "realtimeList"
    );

  try {

    const response =
      await fetch(
        API_URL +
        "/recent-plays?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "recent plays error"
      );
    }

    const data =
      await response.json();

    const plays =
      data.plays || [];

    if (!plays.length) {

      target.innerHTML = `
        <div class="realtime-empty">
          まだ再生履歴はありません
        </div>
      `;

      return;
    }

    target.innerHTML =
      plays
        .slice(0, 6)
        .map(
          play => `
            <div class="realtime-item">
              ${formatPlayTime(play.clicked_at)}
              ${play.title}
            </div>
          `
        )
        .join("");

  } catch (error) {

    console.error(
      "Recent plays:",
      error
    );

  }

}


async function recordPlay(videoId) {

  try {

    await fetch(
      API_URL + "/play",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            video_id: videoId
          })
      }
    );

    loadRecentPlays();

  } catch (error) {

    console.error(
      "Play record:",
      error
    );

  }

}


function handlePlayClick(
  event,
  videoId
) {

  recordPlay(videoId);

}


/* ========================================
   今日・前日
   ======================================== */

  if (

    value === undefined
  ) {

  }

    <div class="change-box">
      トータル

    </div>
  `;

}


function createTodayLikesBox(video) {

  const value =
    video.today_change?.likes;

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return `
    <div class="change-box">
      トータル

    </div>
  `;

}


function createPreviousViewsBox(video) {

function createPreviousLikesBox(video) {

      ${formatShortDate(previous.date)}
      ${formatChange(previous.likes)}
    </div>

/* ========================================
   目標
   ======================================== */

function getGoal(views) {

  const goals = [
    100000,
    200000,
    300000,
    400000,
    500000,
    1000000
  ];

  for (
    const goal of goals
  ) {

    if (views < goal) {
      return goal;
    }

  }

  return (
    Math.floor(
      views / 1000000
    ) + 1
  ) * 1000000;

}


function goalLabel(goal) {

  return (
    goal / 10000
  ).toLocaleString(
    "ja-JP"
  ) + "万";

}


function getPreviousGoal(goal) {

  if (goal === 100000) {
    return 0;
  }

  if (goal <= 500000) {
    return goal - 100000;
  }

  if (goal === 1000000) {
    return 500000;
  }

  return goal - 1000000;

}


/* ========================================
   達成予測
   ======================================== */

function formatPredictionDate(date) {

  const parts =
    new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone:
          "Asia/Tokyo",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false
      }
    ).formatToParts(date);


  const get =
    type =>
      parts.find(
        part =>
          part.type === type
      )?.value || "";


  return (
    get("year") +
    "/" +
    get("month") +
    "/" +
    get("day") +
    " " +
    get("hour") +
    ":" +
    get("minute")
  );

}


function getPaceData(
  video,
  goal
) {

  const sixHourAverage =
    Number(
      video.six_hour_pace
        ?.views_per_hour
    );


  if (
    !Number.isFinite(
      sixHourAverage
    ) ||
    sixHourAverage <= 0
  ) {

    return {
      type:
        "calculating",

      label:
        "ペース算出中",

      arrows:
        "",

      prediction:
        null
    };

  }


  const remaining =
    Math.max(
      goal -
      Number(
        video.views || 0
      ),
      0
    );


  const hoursNeeded =
    remaining /
    sixHourAverage;


  const prediction =
    new Date(
      Date.now() +
      hoursNeeded *
      60 *
      60 *
      1000
    );


  const previousDayViews =
    Number(
      video.previous_day_total
        ?.views
    );


  if (
    !Number.isFinite(
      previousDayViews
    ) ||
    previousDayViews <= 0
  ) {

    return {
      type:
        "steady",

      label:
        "ペース維持中",

      arrows:
        "→ → → → →",

      prediction
    };

  }


  const baselineHourly =
    previousDayViews / 24;


  const changeRate =
    (
      sixHourAverage -
      baselineHourly
    ) /
    baselineHourly;


  if (
    changeRate > 0.05
  ) {

    return {
      type:
        "up",

      label:
        "ペースアップ中",

      arrows:
        "↑ ↑ ↑ ↑ ↑",

      prediction
    };

  }


  if (
    changeRate < -0.05
  ) {

    return {
      type:
        "down",

      label:
        "ペースダウン中",

      arrows:
        "↓ ↓ ↓ ↓ ↓",

      prediction
    };

  }


  return {
    type:
      "steady",

    label:
      "ペース維持中",

    arrows:
      "→ → → → →",

    prediction
  };

}


function createPaceForecast(
  video,
  goal
) {

  const pace =
    getPaceData(
      video,
      goal
    );


  const predictionText =
    pace.prediction
      ? formatPredictionDate(
          pace.prediction
        )
      : "算出中";


  return `
    <div class="pace-box pace-${pace.type}">

      <div
        class="pace-arrow-bg"
        aria-hidden="true"
      >
        ${pace.arrows}
      </div>

      <div class="pace-content">

        <span class="pace-status">
          ${pace.label}
        </span>

        <span class="pace-prediction">
          📊達成予測：${predictionText}
        </span>

      </div>

    </div>
  `;

}


function createGoal(video) {

  const goal =
    getGoal(
      video.views
    );

  const previousGoal =
    getPreviousGoal(
      goal
    );

  const remaining =
    Math.max(
      goal -
      video.views,
      0
    );

  const range =
    goal -
    previousGoal;

  const progress =
    video.views -
    previousGoal;

  const percent =
    Math.max(
      0,
      Math.min(
        progress /
        range *
        100,
        100
      )
    );

  const nearGoal =
    percent >= 90
      ? `<span class="goal-near">❤️‍🔥</span>`
      : "";

  return `
    <div class="goal">

      <div class="goal-text">
        ${goalLabel(goal)}回再生まで
        あと${formatNumber(remaining)}回
        ${nearGoal}
      </div>

      ${createPaceForecast(
        video,
        goal
      )}

      <div class="progress">

        <div
          class="progress-bar"
          style="width:${percent}%"
        ></div>

      </div>

      <div class="progress-percent">
        ${percent.toFixed(1)}%
      </div>

    </div>
  `;

}


/* ========================================
   YouTube
   ======================================== */

function getThumbnail(videoId) {

  return (
    "https://i.ytimg.com/vi/" +
    videoId +
    "/hqdefault.jpg"
  );

}


function getYouTubeUrl(videoId) {

  return (
    "https://www.youtube.com/watch?v=" +
    videoId
  );

}


/* ========================================
   キリ番80%以上
   ======================================== */

function createMilestoneAlerts(videos) {

  const target =
    document.getElementById(
      "milestoneAlerts"
    );

  const alerts =
    videos
      .map(video => {

        const goal =
          getGoal(
            video.views
          );

        const previousGoal =
          getPreviousGoal(
            goal
          );

        const range =
          goal -
          previousGoal;

        const progress =
          video.views -
          previousGoal;

        const rate =
          progress /
          range;

        if (
          rate < 0.8
        ) {
          return "";
        }

        return `
          <div class="milestone-alert">

            <div class="milestone-message">
              📣 ${video.title} ${goalLabel(goal)}回再生間近❤️‍🔥❤️‍🔥
            </div>

            <a
              class="milestone-play"
              href="${getYouTubeUrl(video.id)}"
              target="_blank"
              rel="noopener noreferrer"
              onclick="handlePlayClick(event, '${video.id}')"
            >
              MV再生 ▶
            </a>

          </div>
        `;

      })
      .filter(Boolean);

  target.innerHTML =
    alerts.join("");

}


/* ========================================
   急上昇
   ======================================== */

function createTrending(video) {

  if (
    !video.trending_rank
  ) {
    return "";
  }

  return `
    <div class="trending">
      📢 急上昇の音楽 #${video.trending_rank}

  `;

}


/* ========================================
   MVカード
   ======================================== */

function createCard(video) {

  const hourlyViews =
    video.hourly_change
      ?.views;

  const hourlyLikes =
    video.hourly_change
      ?.likes;

  const dailyViews =
    video.daily_change
      ?.views;

  const dailyLikes =
    video.daily_change
      ?.likes;

  return `
    <article class="card counter-card">
      <div class="video-header">

        <img
          class="thumbnail"
          src="${getThumbnail(video.id)}"

        >

        <div class="video-info">

          <h2 class="title">
            ${video.title}
          </h2>

          ${createTrending(video)}

          <div>

            <a
              class="youtube-button"
              href="${getYouTubeUrl(video.id)}"
              target="_blank"
              rel="noopener noreferrer"
              onclick="handlePlayClick(event, '${video.id}')"
            >
              ▶ YouTubeでMVを見る
            </a>

          </div>

        </div>

      </div>


      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            ▶ 再生回数
          </div>

          <div class="stat-number">
            ${formatNumber(video.views)}
          </div>

          <div class="changes">

            <div class="change-row">

              <span class="change-label">
                1時間比
              </span>

              <span class="change-number">
                ${formatChange(
                  hourlyViews,
                  "回再生"
                )}
              </span>

            </div>

            ${createTodayViewsBox(video)}

            <div class="change-row">

              <span class="change-label">
                前日比
              </span>

              <span class="change-number">
                ${formatChange(
                  dailyViews,
                  "回再生"
                )}
              </span>

            </div>

            ${createPreviousViewsBox(video)}

          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            👍 高評価
          </div>

          <div class="stat-number">
            ${formatNumber(video.likes)}
          </div>

          <div class="changes">

            <div class="change-row">

              <span class="change-label">
                1時間比
              </span>

              <span class="change-number">
                ${formatChange(
                  hourlyLikes
                )}
              </span>

            </div>

            ${createTodayLikesBox(video)}

            <div class="change-row">

              <span class="change-label">
                前日比
              </span>

              <span class="change-number">
                ${formatChange(
                  dailyLikes
                )}
              </span>

            </div>

            ${createPreviousLikesBox(video)}

          </div>

        </div>

      </div>

      ${createGoal(video)}

    </article>
  `;

}


/* ========================================
   更新日時
   ======================================== */

function showUpdatedTime(iso) {

  const date =
    new Date(iso);

  const formatter =
    new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone:
          "Asia/Tokyo",

        month:
          "numeric",

        day:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

  document.getElementById(
    "updated"
  ).textContent =
    formatter.format(date) +
    " 時点";

}


/* ========================================
   日別グラフ
   ======================================== */

function drawHistory(history) {

  const dates = [
    ...new Set(
      history.map(
        item =>
          item.jst_date
      )
    )
  ];


  const datasets =
    VIDEO_ORDER.map(
      title => {

        const rows =
          history.filter(
            item =>
              item.title ===
              title
          );

        const values =
          dates.map(
            date => {

              const row =
                rows.find(
                  item =>
                    item.jst_date ===
                    date
                );

              return row
                ? Number(
                    row.end_views
                  )
                : null;

            }
          );


        return {
          label: title,
          data: values,
          tension: 0.25,
          spanGaps: true,
          borderWidth: 2,
          pointRadius: 3
        };

      }
    );


  if (
    historyChart
  ) {
    historyChart.destroy();
  }


  const ctx =
    document.getElementById(
      "historyChart"
    );


  historyChart =
    new Chart(
      ctx,
      {

        type: "line",

        data: {
          labels: dates,
          datasets
        },

        options: {

          responsive: true,

          maintainAspectRatio:
            false,

          interaction: {
            mode: "index",
            intersect: false
          },

          plugins: {

            legend: {
              position: "bottom",

              labels: {
                boxWidth: 12,
                padding: 14
              }
            },

            tooltip: {

              callbacks: {

                label(context) {

                  const value =
                    context.parsed.y;

                  if (
                    value === null
                  ) {
                    return "";
                  }

                  return (
                    context.dataset.label +
                    "：" +
                    formatNumber(value) +
                    "回"
                  );

                }

              }

            }

          },

          scales: {

            y: {

              ticks: {

                callback(value) {

                  return Number(
                    value
                  ).toLocaleString(
                    "ja-JP",
                    {
                      notation:
                        "compact"
                    }
                  );

                }

              }

            },

            x: {

              ticks: {
                maxRotation: 0
              }

            }

          }

        }

      }
    );

}


/* ========================================
   データ取得
   ======================================== */

async function loadData() {

  const cards =
    document.getElementById(
      "cards"
    );

  try {

    const response =
      await fetch(
        API_URL +
        "?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    if (
      !response.ok
    ) {

      throw new Error(
        "API error"
      );

    }

    const data =
      await response.json();


    showUpdatedTime(
      data.updated_at
    );


    // All MV counters, including PIECES, now use the production statistics Worker.
    const allVideos=[...data.videos];
    const allHistory=[...(data.daily_history||[])];
    // Keep PIECES visible even before the updated Worker is deployed.
    // Do not fabricate counts while production data is unavailable.
    if(!allVideos.some(v=>v.id===PIECES_VIDEO_ID || v.title==='PIECES')) {
      allVideos.push({id:PIECES_VIDEO_ID,title:'PIECES',pending_pieces:true});
    }
    // Show the new MV card before the YouTube ID is available. Never show fabricated zero counts.
    if(!allVideos.some(v=>v.title==='Slam Dunk')) {
      allVideos.push({title:'Slam Dunk',pending_mv:true});
    }
    const sortedVideos=allVideos.sort((a,b)=>{
      const ai=VIDEO_ORDER.indexOf(a.title),bi=VIDEO_ORDER.indexOf(b.title);
      return (ai<0?999:ai)-(bi<0?999:bi);
    });

    createMilestoneAlerts(
      sortedVideos.filter(v=>!v.pending_mv && !v.pending_pieces)
    );


    cards.innerHTML =
      sortedVideos
        .map(video => video.pending_mv
          ? `<article class="card"><h2 class="title">Slam Dunk</h2><p style="text-align:center;padding:26px 12px;color:#c9c8de;letter-spacing:.08em">2026.10.26 21:00 公開予定</p><p style="text-align:center;color:#aeb3c9;font-size:12px">カウンター準備中</p></article>`
          : video.pending_pieces
          ? `<article class="card"><h2 class="title">PIECES</h2><p style="text-align:center;padding:20px 12px;color:#555">本番カウンターの接続待ち</p></article>`
          : createCard(video))
        .join("");


    drawHistory(allHistory);

  } catch (error) {

    console.error(
      error
    );

    cards.innerHTML = `
      <div class="error">
        データを取得できませんでした。<br>
        少し時間を置いて再読み込みしてください。
      </div>
    `;

  }

}


/* ========================================
   起動
   ======================================== */

loadData();

loadRecentPlays();


/* リアルタイム欄：10秒ごと */

setInterval(
  loadRecentPlays,
  10000
);


/* MVデータ：5分ごと */

setInterval(
  loadData,
  300000
);

</script>
